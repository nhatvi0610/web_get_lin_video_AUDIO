<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trang Hỗ Trợ</title>
<style>
  :root {
    --bg1: #1e1b4b;
    --bg2: #0f172a;
    --accent1: #6366f1;
    --accent2: #ec4899;
    --accent3: #06b6d4;
    --text: #f1f5f9;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    background: linear-gradient(135deg, var(--bg1), var(--bg2));
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 16px;
  }

  h1 {
    font-size: 1.8rem;
    margin-bottom: 32px;
    text-align: center;
    background: linear-gradient(90deg, var(--accent1), var(--accent2), var(--accent3));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .main-buttons {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    justify-content: center;
    width: 100%;
    max-width: 700px;
  }

  .main-btn {
    flex: 1 1 180px;
    padding: 22px 18px;
    border: none;
    border-radius: 20px;
    font-size: 1.1rem;
    font-weight: 600;
    color: #fff;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
    display: inline-block;
    background-size: 200% 200%;
    background-position: 0% 50%;
    transition: background-position 0.5s ease, transform 0.25s ease, box-shadow 0.25s ease;
    box-shadow: 0 6px 18px rgba(0,0,0,0.35);
  }

  .main-btn:hover, .main-btn.active {
    background-position: 100% 50%;
    transform: translateY(-4px) scale(1.03);
    box-shadow: 0 10px 26px rgba(0,0,0,0.5);
  }

  .btn-link {
    background-image: linear-gradient(135deg, #6366f1, #8b5cf6, #6366f1);
  }
  .btn-audio {
    background-image: linear-gradient(135deg, #06b6d4, #3b82f6, #06b6d4);
  }
  .btn-video {
    background-image: linear-gradient(135deg, #ec4899, #f97316, #ec4899);
  }

  .panel {
    width: 100%;
    max-width: 700px;
    margin-top: 24px;
    display: none;
    animation: fadeIn 0.35s ease;
  }

  .panel.open { display: block; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
    gap: 10px;
  }

  .grid a {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 14px 6px;
    border-radius: 14px;
    text-decoration: none;
    color: #fff;
    font-weight: 600;
    font-size: 0.95rem;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.15);
    transition: background 0.25s ease, transform 0.2s ease, border-color 0.25s ease;
  }

  .grid.audio a:hover {
    background: linear-gradient(135deg, #06b6d4, #3b82f6);
    border-color: transparent;
    transform: translateY(-2px);
  }

  .grid.video a:hover {
    background: linear-gradient(135deg, #ec4899, #f97316);
    border-color: transparent;
    transform: translateY(-2px);
  }

  .grid a.disabled {
    opacity: 0.35;
    pointer-events: none;
  }

  .hint {
    font-size: 0.85rem;
    opacity: 0.7;
    margin-top: 10px;
  }

  .panel-title {
    font-size: 1.1rem;
    margin-bottom: 12px;
    opacity: 0.85;
  }

  .loading {
    opacity: 0.6;
    font-size: 0.9rem;
    margin-top: 20px;
  }
</style>
</head>
<body>

  <h1>Trang Hỗ Trợ</h1>

  <div class="main-buttons">
    <a href="#" id="btnLink" class="main-btn btn-link" target="_blank" rel="noopener">Tải Tổng Hợp</a>
    <button type="button" id="btnAudio" class="main-btn btn-audio">Âm Thanh</button>
    <button type="button" id="btnVideo" class="main-btn btn-video">Video</button>
  </div>

  <div id="loadingMsg" class="loading">Đang tải dữ liệu...</div>

  <div class="panel" id="panelAudio">
    <div class="panel-title">Chọn mục âm thanh (bấm vào để mở link trực tiếp):</div>
    <div class="grid audio" id="gridAudio"></div>
  </div>

  <div class="panel" id="panelVideo">
    <div class="panel-title">Chọn mục video (bấm vào để mở link trực tiếp):</div>
    <div class="grid video" id="gridVideo"></div>
  </div>

  <a href="admin.html" style="margin-top:34px;color:var(--text);opacity:0.5;text-decoration:none;font-size:0.8rem;">⚙ Trang quản lý link</a>

  <script>
    // ====== CẤU HÌNH SUPABASE ======
    const SUPABASE_URL = "https://habcafhqeoqqgndiyyke.supabase.co";
    const SUPABASE_KEY = "sb_publishable_cwB_1BQUR8JIzfvjHXfhgQ_1s0BnEfq";
    // ================================

    const btnLink = document.getElementById('btnLink');
    const btnAudio = document.getElementById('btnAudio');
    const btnVideo = document.getElementById('btnVideo');
    const panelAudio = document.getElementById('panelAudio');
    const panelVideo = document.getElementById('panelVideo');
    const gridAudio = document.getElementById('gridAudio');
    const gridVideo = document.getElementById('gridVideo');
    const loadingMsg = document.getElementById('loadingMsg');

    function buildGrid(container, list) {
      container.innerHTML = '';
      (list || []).forEach((url, idx) => {
        const a = document.createElement('a');
        const valid = url && url !== '#';
        a.href = valid ? url : '#';
        a.textContent = idx + 1;
        a.target = "_blank";
        a.rel = "noopener";
        if (!valid) a.classList.add('disabled');
        container.appendChild(a);
      });
    }

    async function loadLinks() {
      try {
        const res = await fetch(
          `${SUPABASE_URL}/rest/v1/site_links?id=eq.1&select=*`,
          {
            headers: {
              apikey: SUPABASE_KEY,
              Authorization: `Bearer ${SUPABASE_KEY}`
            }
          }
        );
        if (!res.ok) throw new Error('Lỗi tải dữ liệu: ' + res.status);
        const rows = await res.json();
        const data = rows[0] || { main_link: '#', audio: [], video: [] };

        btnLink.href = data.main_link && data.main_link !== '#' ? data.main_link : '#';
        buildGrid(gridAudio, data.audio);
        buildGrid(gridVideo, data.video);
        loadingMsg.style.display = 'none';
      } catch (err) {
        console.error(err);
        loadingMsg.textContent = 'Không tải được dữ liệu. Vui lòng tải lại trang.';
      }
    }
    loadLinks();

    function togglePanel(panel, btn, otherPanel, otherBtn) {
      const isOpen = panel.classList.contains('open');
      panel.classList.toggle('open', !isOpen);
      btn.classList.toggle('active', !isOpen);
      otherPanel.classList.remove('open');
      otherBtn.classList.remove('active');
    }

    btnAudio.addEventListener('click', () => togglePanel(panelAudio, btnAudio, panelVideo, btnVideo));
    btnVideo.addEventListener('click', () => togglePanel(panelVideo, btnVideo, panelAudio, btnAudio));
  </script>

</body>
</html>
